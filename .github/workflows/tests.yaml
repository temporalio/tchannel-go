name: Tests

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22.x", "1.23.x"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      # The thrift/thrift-gen tests require the Apache Thrift compiler toolchain,
      # which this workflow does not provision, so that package is excluded.
      # TestRelayCloseTimeout is a pre-existing flaky timing test.
      run: go test -count=1 -skip 'TestRelayCloseTimeout' $(go list ./... | grep -v '/thrift/thrift-gen')

    - name: Test (race)
      # Race detection on the concurrency-critical tchannel package. Scoped to
      # this package to avoid load-induced timing flakes seen when the whole
      # module is run under -race in parallel.
      run: go test -race -count=1 -skip 'TestRelayCloseTimeout' .
