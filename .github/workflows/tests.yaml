name: Tests

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22.x", "1.23.x"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build ./...

    - name: Test
      # The thrift/thrift-gen tests require the Apache Thrift compiler toolchain,
      # which this workflow does not provision, so that package is excluded.
      run: go test -count=1 $(go list ./... | grep -v '/thrift/thrift-gen')
